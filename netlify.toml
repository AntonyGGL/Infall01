[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Una sola URL por página: Netlify ("Pretty URLs") publica los enlaces sin .html,
# así que esa es la canónica. La versión .html redirige a la versión sin .html.
[[redirects]]
  from = "/servicios.html"
  to = "/servicios"
  status = 301
  force = true

[[redirects]]
  from = "/portfolio.html"
  to = "/portfolio"
  status = 301
  force = true

