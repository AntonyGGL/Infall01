[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Una sola URL por página: la versión sin .html redirige a la .html
# (la .html es la canónica, la del sitemap y la de los enlaces internos).
[[redirects]]
  from = "/servicios"
  to = "/servicios.html"
  status = 301
  force = true

[[redirects]]
  from = "/servicios/"
  to = "/servicios.html"
  status = 301
  force = true

